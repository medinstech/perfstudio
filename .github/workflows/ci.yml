name: CI

# Every push and every pull request. This project's central claim is that the Python
# engine reproduces the retired TypeScript one byte for byte (see the golden fixtures
# under tools/diffcheck/), and a proof nobody runs is not a proof.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,mcp]"
      # src only, and deliberately: the engine is strict-clean and must stay that way,
      # while the tests are not and never have been. Gating on something already broken
      # teaches everyone to ignore the red tick.
      - run: mypy --strict src

  test:
    name: tests · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports, rather than the first failure hiding the others. A
      # rendering fault is usually specific to one of them, which is the whole reason
      # there is a matrix at all.
      fail-fast: false
      matrix:
        # ALL THREE, ON EVERY PUSH. This was Linux-only off the default branch while the
        # repository was private and runner minutes were metered unevenly -- Windows at
        # 2x, macOS at 10x -- with the condition carrying an instruction to delete it on
        # going public, because standard runners are free on public repositories.
        #
        # Deleted, and the first full matrix that ran under it is the argument for
        # restricting it no further: it found a VTK abort on Windows that took the whole
        # session down with it, and two footprint goldens failing on macOS arm64 by one
        # ULP of the terms they are summed from. Neither is visible on Linux, and both
        # are ordinary edits away from being reintroduced. "Seen before a release" is a
        # weaker property than it sounds when a release is where they were seen.
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python: ["3.12"]
        include:
          # The floor is what pyproject promises; the ceiling is what breaks first.
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Qt and VTK ship their own wheels but link against the system's X, GL and dbus
      # libraries, none of which a bare runner image has. Without these the suite does
      # not fail informatively -- PySide6 refuses to import at all.
      - name: System libraries for Qt and VTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglx-mesa0 libglu1-mesa \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libdbus-1-3 xvfb

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,mcp]"

      # Qt runs offscreen (tests/test_ui.py sets QT_QPA_PLATFORM itself), but VTK opens a
      # real GL context for the build guide's step images, and offscreen is not the same
      # thing as headless. xvfb gives it one.
      - name: pytest
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -q
      - name: pytest
        if: runner.os != 'Linux'
        run: pytest -q

      # The end-to-end path, and the only thing that exercises 2D, 3D and the PDF export
      # against a real board rather than against assertions about them. It renders,
      # verifies the 1:1 scale, runs DRC and LVS, and writes the build guide.
      # Held to its exit status everywhere, including the runner with no GPU. It was not,
      # briefly: this runner aborts inside VTK rather than raising, so the step was
      # allowed to fail and only checked that a 2D render appeared. `--headless` now asks
      # `view3d.offscreen_gl_available` first and reports what it could not draw instead
      # of dying, so a non-zero exit here means something is actually wrong again.
      - name: headless render, DRC, LVS and guide
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m perfstudio.ui.main --headless tools/diffcheck/golden/dense.perf
      - name: headless render, DRC, LVS and guide
        if: runner.os != 'Linux'
        run: python -m perfstudio.ui.main --headless tools/diffcheck/golden/dense.perf

      - name: Keep what it drew
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-${{ matrix.os }}-py${{ matrix.python }}
          path: headless_out/
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: ruff
    runs-on: ubuntu-latest
    # A GATE, as of the commit that emptied it. It reported 466 findings and did not
    # block, which is the worst of both: a permanently red tick teaches everyone to stop
    # reading it. 389 of those were two rules that are simply wrong for this codebase and
    # are now switched off in pyproject with the reason at the switch -- E501 on prose a
    # formatter could not split either, and ambiguous-unicode on the Turkish catalogue's
    # dotless "i". The remaining 77 were fixed, four of them by hand because ruff's own
    # fix would have inlined a multi-line call onto one 200-character line.
    #
    # `ruff format` is still NOT run. It would rewrite 40 of the 57 files and point every
    # line of blame in this repository at a reformat, which is a decision of its own and
    # not a side effect of turning the linter on.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Pinned to a minor, and today of all days: an unbounded `mcp>=1.0` picked up a new
      # major this morning and took the MCP server and all three installers down with it.
      # A linter is the same hazard in a smaller way -- a new minor adds rules, and rules
      # added by somebody else's release schedule would fail a gate on a tree nobody
      # touched. Raise it deliberately, with the fixes in the same commit.
      - run: pip install "ruff>=0.15,<0.16"
      # The findings themselves, not a count of them: this fails the build now, and a job
      # that fails should print the thing to fix.
      - run: ruff check src tests

      # REPORTS, DOES NOT BLOCK, and it is the one thing in this job that does not. Making
      # the linter a gate turned this into one by accident on its first run: it answered
      # "41 files would be reformatted" and failed the build, quietly deciding the exact
      # question the comment above says is not being decided here. Adopting the formatter
      # rewrites 41 of 60 files in one commit; the number is worth watching, and it is not
      # worth watching from behind a red tick that means something else.
      - run: ruff format --check src tests || echo "::warning::$(ruff format --check src tests 2>&1 | tail -1)"
