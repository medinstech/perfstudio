[project]
name = "perfstudio"
# Single-sourced from the package rather than repeated here: see docs/RELEASING.md and
# the docstring on version.py. A version written down twice is a version that will
# disagree with itself, usually inside a released artefact.
dynamic = ["version"]
description = "Perfboard layout designer: netlist-driven placement and routing, perfboard-specific design rules, layout-vs-schematic verification, and a step-by-step soldering guide with measurement checkpoints."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "PySide6>=6.10",
    "vtk>=9.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "mypy>=1.13", "ruff>=0.8", "pyinstaller>=6.10"]
# Capped below 2.0, and the cap is load-bearing rather than cautious. `mcp` 2.0.0 removed
# `mcp.server.fastmcp` outright -- the decorator API every tool in `mcp/server.py` is
# bound with -- so the server does not import at all there, and PyInstaller's
# `collect_submodules("mcp")` dies on the same package with "typer is required", which
# takes all three installers down with it. 1.29.0 still ships fastmcp and deprecates
# nothing. Lifting this means porting 39 tools to the 2.x API, which is a change with its
# own verification attached, not a version bump.
mcp = ["mcp>=1.0,<2"]

[project.scripts]
perfstudio = "perfstudio.ui.main:main"
perfstudio-mcp = "perfstudio.mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "perfstudio.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# The application mark, generated by `python tools/make_assets.py`. Listed explicitly
# rather than through include-package-data, so that what ends up in a wheel is a decision
# rather than whatever happened to be sitting in the tree.
[tool.setuptools.package-data]
perfstudio = ["ui/assets/*.png", "ui/assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
# The engine is pure and must stay that way; UI code may be looser.
[[tool.mypy.overrides]]
module = "perfstudio.ui.*"
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# Two rules are switched off, and each is a decision rather than a surrender. Everything
# else in the selection above is a gate: the `lint` CI job fails on it.
ignore = [
    # E501 fired 235 times, median 105 characters and longest 124, and almost every one is
    # prose -- an explanatory comment or a message string. A formatter cannot split those
    # either, which is why ruff's own guidance is to leave line length to the formatter
    # rather than the linter. `line-length` above stays at 100 as the target to write to;
    # adopting `ruff format` is the separate deliberate act that would settle the rest,
    # and it would rewrite 40 of 57 files, so it is not being done as a side effect of
    # turning the linter on.
    "E501",
    # Ambiguous-unicode, 154 times, and wrong here every time. 137 are the dotless "ı" in
    # the Turkish catalogue, which is not a suspicious lookalike of "i" -- it is a
    # different letter of the language the interface speaks. The rest are "ρ" for
    # resistivity in DRC's docstrings and "×" in "5 × 7 cm". The rule exists to catch
    # homoglyph attacks in source; this project's source is deliberately multilingual and
    # deliberately typographic, and a rule that flags correct Turkish 137 times is a rule
    # that teaches people to stop reading the output.
    "RUF001",
    "RUF002",
    "RUF003",
]
