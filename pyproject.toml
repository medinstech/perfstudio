[project]
name = "perfstudio"
version = "0.0.0"
description = "Perfboard layout designer: netlist-driven placement and routing, perfboard-specific design rules, layout-vs-schematic verification, and a step-by-step soldering guide with measurement checkpoints."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "PySide6>=6.10",
    "vtk>=9.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "mypy>=1.13", "ruff>=0.8"]
mcp = ["mcp>=1.0"]

[project.scripts]
perfstudio = "perfstudio.ui.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
# The engine is pure and must stay that way; UI code may be looser.
[[tool.mypy.overrides]]
module = "perfstudio.ui.*"
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
