[project]
name = "perfstudio"
# Single-sourced from the package rather than repeated here: see docs/RELEASING.md and
# the docstring on version.py. A version written down twice is a version that will
# disagree with itself, usually inside a released artefact.
dynamic = ["version"]
description = "Perfboard layout designer: netlist-driven placement and routing, perfboard-specific design rules, layout-vs-schematic verification, and a step-by-step soldering guide with measurement checkpoints."
# The project page on PyPI IS this file, and `twine check --strict` in release.yml fails
# without it -- which is how the first wheel was found to have no description at all.
#
# README.md carries absolute github.com/raw.githubusercontent.com links rather than
# relative ones, and that is this field's doing: PyPI resolves neither images nor links
# relative to the repository, so a README written the natural way renders there as four
# broken images and fourteen dead links. GitHub renders the absolute form identically, so
# there is still one README and no second copy to drift. README.tr.md keeps its relative
# links, because nothing packages it.
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# "perf" in the name is what PLAN.md §12 chose it for; these are the rest of the
# discoverability, and the classifier list is the only place a package says which field it
# belongs to. No `License ::` classifier: `license` above is an SPDX expression (PEP 639)
# and setuptools rejects being told twice.
keywords = [
    "perfboard", "stripboard", "veroboard", "protoboard", "eda", "pcb",
    "kicad", "netlist", "autorouter", "drc", "lvs", "electronics", "soldering",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Natural Language :: Turkish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

dependencies = [
    "PySide6>=6.10",
    "vtk>=9.6",
]

# The sidebar of the PyPI page. Kept here rather than folded into the description because
# PyPI links them individually and a person landing on the page from a search has no other
# route back to the repository.
[project.urls]
Homepage = "https://github.com/medinstech/perfstudio"
Repository = "https://github.com/medinstech/perfstudio"
Documentation = "https://github.com/medinstech/perfstudio#where-everything-else-is-written-down"
Changelog = "https://github.com/medinstech/perfstudio/blob/main/CHANGELOG.md"
Issues = "https://github.com/medinstech/perfstudio/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "mypy>=1.13",
    "ruff>=0.8",
    "pyinstaller>=6.10",
    # PyPI's own classifier list, as data. `twine check --strict` does NOT validate
    # classifiers -- it only checks that the description renders -- so an invented one
    # passes every local check and is refused by the upload, after the tag exists.
    # That is what happened to 0.8.0. See test_version.py.
    "trove-classifiers",
]
# Capped below 2.0, and the cap is load-bearing rather than cautious. `mcp` 2.0.0 removed
# `mcp.server.fastmcp` outright -- the decorator API every tool in `mcp/server.py` is
# bound with -- so the server does not import at all there, and PyInstaller's
# `collect_submodules("mcp")` dies on the same package with "typer is required", which
# takes all three installers down with it. 1.29.0 still ships fastmcp and deprecates
# nothing. Lifting this means porting 51 tools to the 2.x API, which is a change with its
# own verification attached, not a version bump.
mcp = ["mcp>=1.0,<2"]

[project.scripts]
perfstudio = "perfstudio.ui.main:main"
perfstudio-mcp = "perfstudio.mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "perfstudio.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# The application mark, generated by `python tools/make_assets.py`. Listed explicitly
# rather than through include-package-data, so that what ends up in a wheel is a decision
# rather than whatever happened to be sitting in the tree.
[tool.setuptools.package-data]
perfstudio = ["ui/assets/*.png", "ui/assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
# The engine is pure and must stay that way; UI code may be looser.
[[tool.mypy.overrides]]
module = "perfstudio.ui.*"
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# Two rules are switched off, and each is a decision rather than a surrender. Everything
# else in the selection above is a gate: the `lint` CI job fails on it.
ignore = [
    # E501 fired 235 times, median 105 characters and longest 124, and almost every one is
    # prose -- an explanatory comment or a message string. A formatter cannot split those
    # either, which is why ruff's own guidance is to leave line length to the formatter
    # rather than the linter. `line-length` above stays at 100 as the target to write to;
    # adopting `ruff format` is the separate deliberate act that would settle the rest,
    # and it would rewrite 40 of 57 files, so it is not being done as a side effect of
    # turning the linter on.
    "E501",
    # Ambiguous-unicode, 154 times, and wrong here every time. 137 are the dotless "ı" in
    # the Turkish catalogue, which is not a suspicious lookalike of "i" -- it is a
    # different letter of the language the interface speaks. The rest are "ρ" for
    # resistivity in DRC's docstrings and "×" in "5 × 7 cm". The rule exists to catch
    # homoglyph attacks in source; this project's source is deliberately multilingual and
    # deliberately typographic, and a rule that flags correct Turkish 137 times is a rule
    # that teaches people to stop reading the output.
    "RUF001",
    "RUF002",
    "RUF003",
]
