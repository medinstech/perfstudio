[project]
name = "perfstudio"
# Single-sourced from the package rather than repeated here: see docs/RELEASING.md and
# the docstring on version.py. A version written down twice is a version that will
# disagree with itself, usually inside a released artefact.
dynamic = ["version"]
description = "Perfboard layout designer: netlist-driven placement and routing, perfboard-specific design rules, layout-vs-schematic verification, and a step-by-step soldering guide with measurement checkpoints."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "PySide6>=6.10",
    "vtk>=9.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "mypy>=1.13", "ruff>=0.8", "pyinstaller>=6.10"]
# Capped below 2.0, and the cap is load-bearing rather than cautious. `mcp` 2.0.0 removed
# `mcp.server.fastmcp` outright -- the decorator API every tool in `mcp/server.py` is
# bound with -- so the server does not import at all there, and PyInstaller's
# `collect_submodules("mcp")` dies on the same package with "typer is required", which
# takes all three installers down with it. 1.29.0 still ships fastmcp and deprecates
# nothing. Lifting this means porting 39 tools to the 2.x API, which is a change with its
# own verification attached, not a version bump.
mcp = ["mcp>=1.0,<2"]

[project.scripts]
perfstudio = "perfstudio.ui.main:main"
perfstudio-mcp = "perfstudio.mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "perfstudio.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# The application mark, generated by `python tools/make_assets.py`. Listed explicitly
# rather than through include-package-data, so that what ends up in a wheel is a decision
# rather than whatever happened to be sitting in the tree.
[tool.setuptools.package-data]
perfstudio = ["ui/assets/*.png", "ui/assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
# The engine is pure and must stay that way; UI code may be looser.
[[tool.mypy.overrides]]
module = "perfstudio.ui.*"
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
